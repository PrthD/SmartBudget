<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SmartBudget — Budgeting, goals and insights</title>
    <meta
      name="description"
      content="SmartBudget helps you track spending, plan budgets, reach savings goals and get AI-powered insights."
    />
    <meta name="theme-color" content="#0f766e" />
    <!-- Link previews (LinkedIn, Slack, X…). Crawlers need absolute URLs. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="SmartBudget" />
    <meta property="og:url" content="https://smartbudget-frontend.onrender.com/" />
    <meta property="og:title" content="SmartBudget — Personal finance, made clear" />
    <meta
      property="og:description"
      content="Track spending and income, plan budgets, save toward goals and get plain-language insights, with optional AI-assisted entry."
    />
    <meta property="og:image" content="https://smartbudget-frontend.onrender.com/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="627" />
    <meta property="og:image:alt" content="SmartBudget dashboard with cash flow, budgets and insights" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96x96.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      // Apply the saved theme before first paint to avoid a light/dark flash.
      try {
        var theme = localStorage.getItem('theme') || 'system';
        var dark =
          theme === 'dark' ||
          (theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        if (dark) document.documentElement.classList.add('dark');
      } catch (e) {}
    </script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run SmartBudget.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
